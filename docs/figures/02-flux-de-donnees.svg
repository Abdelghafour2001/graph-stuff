<text x="599" y="391.5" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">import_referentials et import_referential_yaml : pays, régions, alias</text>
<text x="599" y="407.7" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">de produits, sociétés.</text>
