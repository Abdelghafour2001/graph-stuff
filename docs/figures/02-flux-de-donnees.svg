<polygon points="1194,508.5 1183,502.5 1183,514.5" fill="#8A96A6"/>
<g id="Flux 4 — enregistrements → actifs">
<rect x="580" y="576.5" width="520" height="104" rx="8" fill="#FFFFFF" stroke="#D6DCE4" stroke-width="1"/>
<rect x="580" y="576.5" width="4" height="104" rx="2" fill="#B7831A"/>
<text x="599" y="606.5" font-family="Inter" font-size="14" font-weight="600" fill="#13202F" text-anchor="start">Flux 4 — enregistrements → actifs</text>
<text x="599" y="631.5" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">entity_resolution propose des regroupements (LLM) ; chargement</text>
<text x="599" y="647.7" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">déterministe au statut « proposé ».</text>
</g>
<line x1="512" y1="628.5" x2="578" y2="628.5" stroke="#8A96A6" stroke-width="1.5"/>
