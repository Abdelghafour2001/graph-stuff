<polygon points="1194,628.5 1183,622.5 1183,634.5" fill="#8A96A6"/>
<g id="Restitution et revue (sortant)">
<rect x="64" y="740" width="1572" height="72" rx="10" fill="#EEF6EC" stroke="#D3E8CE" stroke-width="1"/>
<text x="85.5" y="769" font-family="Inter" font-size="13" font-weight="700" fill="#3D7F35" text-anchor="start">Restitution et revue (sortant)</text>
<text x="85.5" y="791.0" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">Réponses citées, specs d’extraction et diagnostics de variance partent en file de revue (specs/, data/diagnoses/, proposals.jsonl) ; une fois validés, ils reviennent dans le graphe au prochain chargement.</text>
</g>
<g id="Mécanismes transverses de tous les flux">
<rect x="64" y="828" width="1572" height="72" rx="10" fill="#EAF5F3" stroke="#C9E5DF" stroke-width="1"/>
<text x="85.5" y="857" font-family="Inter" font-size="13" font-weight="700" fill="#1E7A6C" text-anchor="start">Mécanismes transverses de tous les flux</text>
<text x="85.5" y="879.0" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">load_all.sh rejouable · dry-run de l’ontologie avant rechargement · requêtes « as of » sans fuite d’information future · étapes LLM lancées à la main et mises en cache · lecture seule pour les agents.</text>
</g>
<g id="Légende">
<line x1="64" y1="935" x2="92" y2="935" stroke="#1E7A6C" stroke-width="1.5"/>
<text x="102" y="939" font-family="Inter" font-size="11.5" font-weight="400" fill="#4B5768" text-anchor="start">chargement déterministe</text>
<line x1="272.6" y1="935" x2="300.6" y2="935" stroke="#B7831A" stroke-width="1.5"/>
<text x="310.6" y="939" font-family="Inter" font-size="11.5" font-weight="400" fill="#4B5768" text-anchor="start">étape avec extraction LLM vérifiée</text>
</g>
<text x="64" y="966" font-family="Inter" font-size="12" font-weight="400" fill="#7A8696" text-anchor="start">Les volumes cités sont ceux de l’exploration du 25-09-2026 ; les routes de prix utilisées par le diagnostic sont à vérifier avec scripts/check_driver_series.py.</text>
</svg>
