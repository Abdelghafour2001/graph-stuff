<polygon points="1194,388.5 1183,382.5 1183,394.5" fill="#8A96A6"/>
<g id="Flux 3 — articles → sous-graphe news">
<rect x="580" y="456.5" width="520" height="104" rx="8" fill="#FFFFFF" stroke="#D6DCE4" stroke-width="1"/>
<rect x="580" y="456.5" width="4" height="104" rx="2" fill="#B7831A"/>
<text x="599" y="486.5" font-family="Inter" font-size="14" font-weight="600" fill="#13202F" text-anchor="start">Flux 3 — articles → sous-graphe news</text>
<text x="599" y="511.5" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">news_graph relie les articles aux concepts ; news_extract ne garde que</text>
<text x="599" y="527.7" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">les citations retrouvées mot pour mot.</text>
</g>
<line x1="512" y1="508.5" x2="578" y2="508.5" stroke="#8A96A6" stroke-width="1.5"/>
