<g id="Flux 1 — classeurs → graphe des classeurs">
<rect x="580" y="216.5" width="520" height="104" rx="8" fill="#FFFFFF" stroke="#D6DCE4" stroke-width="1"/>
<rect x="580" y="216.5" width="4" height="104" rx="2" fill="#1E7A6C"/>
<text x="599" y="246.5" font-family="Inter" font-size="14" font-weight="600" fill="#13202F" text-anchor="start">Flux 1 — classeurs → graphe des classeurs</text>
<text x="599" y="271.5" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">profile_excels.py profile chaque feuille ; workbook_graph.py relie</text>
<text x="599" y="287.7" font-family="Inter" font-size="12" font-weight="400" fill="#4B5768" text-anchor="start">en-têtes et libellés aux concepts.</text>
</g>
