    extractor_code: phosphateoutlook_2024m10_datafile_costsprices__costdata.py
    matches:
      exact:
        - value: "CostData"
          params:
            data_provider: "sp"
            header_rows: 6

  - name: cost_service_database
    description: >
      Unified caster for CRU cost service flat database "Database" sheets.
      Covers phosphate-fertilizer and phosphate-rock cost service files.
      Product auto-detected: from Commodity column or document name.
      Entity = company (parent) → company_site (child).
    extractor_code: cru_cost_service_caster.py

    matches:
      exact:
        # ---------- CRU: Sheet to SKIP ----------
        - value: "Table of Contents"
          data_provider: "cru"
          params: { skip: true }

        # ---------- CRU: Database sheet (both files) ----------
        - value: "Database"
          data_provider: "cru"

  - name: argus_potash_analytics_1q_DATE_capacity_by_plant
