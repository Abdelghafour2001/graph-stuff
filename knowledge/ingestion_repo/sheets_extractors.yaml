    extractor_code: argus_potash_analytics_1q_DATE_capacity_by_plant.py

    matches:
      exact:
        - value: "NPK Capacity List"
          data_provider: "argus"
          file_regex: "(?i).*argus.*potash.*"

  - name: "freight_trades_caster"
    description: "Extracteur freight trades"
    extractor_code: "freight_trad_caster.py"
    file_regex: "(?i)fertilizer.?week|freight"
    matches:
      exact:
        # -----------------------------
        # A) TOC / Section sheets |Ammonia|UAN|AS|DAP\\-MAP|Phosphoric Acid|Phosphate Rock|MOP|Sulphur|Sulphuric Acid)$
        # -----------------------------
        - value: "Ammonia"
          data_provider: "cru"
        - value: "UAN"
          data_provider: "cru"
        - value: "AS"
          data_provider: "cru"
        - value: "DAP-MAP"
          data_provider: "cru"
        - value: "Phosphoric Acid"
          data_provider: "cru"
        - value: "Phosphate Rock"
          data_provider: "cru"
        - value: "MOP"
          data_provider: "cru"
        - value: "Sulphur"
          data_provider: "cru"
        - value: "Sulphuric Acid"
          data_provider: "cru"


  - name: regional_totals
    description: >
      Unified caster for all "Total ..." sheets with Region|Country|Years layout.
      Supports Argus, S&P, and CRU sources.  Product auto-detected.
    extractor_code: regional_totals_caster.py

    matches:
      exact:
        # ---------- Ammonia (Argus) ----------
        - value: "Total Gross Capacity"
          data_provider: "argus"
        - value: "Total Merchant Capacity"
          data_provider: "argus"
        - value: "Total Gross Production"
          data_provider: "argus"
        - value: "Total Merchant Production"
          data_provider: "argus"
        - value: "Total Gross Consumption"
          data_provider: "argus"
        - value: "Total Merchant Consumption"
          data_provider: "argus"
        # ---------- Phosphate Rock (Argus) ----------
        - value: "Total Capacity"
          data_provider: "argus"
        - value: "Total Production"
          data_provider: "argus"
        - value: "Total Consumption"
          data_provider: "argus"
        # ---------- Potash (Argus) ----------
        - value: "Total MOP Capacity"
          data_provider: "argus"
        - value: "Achievable MOP Production"
          data_provider: "argus"
        - value: "Total MOP Production"
          data_provider: "argus"
        - value: "Total MOP Consumption"
          data_provider: "argus"
        - value: "Total MOP Imports"
          data_provider: "argus"
        - value: "Total MOP Exports"
          data_provider: "argus"
        # ---------- Shared Argus (Imports/Exports) ----------
        - value: "Total Imports"
          data_provider: "argus"
        - value: "Total Exports"
          data_provider: "argus"
        # ---------- Argus Ammonia Analytics (simple sheet names) ----------
        - value: "Production"
          data_provider: "argus"
          file_regex: "(?i)argus.*ammonia"
        - value: "Imports"
          data_provider: "argus"
          file_regex: "(?i)argus.*ammonia"
        - value: "Exports"
          data_provider: "argus"
          file_regex: "(?i)argus.*ammonia"
        - value: "Ammonia"
          data_provider: "argus"
          file_regex: "(?i)argus.*ammonia"
        # ---------- Urea (Argus) ----------
        - value: "Total Capacity"
          data_provider: "argus"
        - value: "Total Production"
          data_provider: "argus"
        - value: "Total Consumption"
          data_provider: "argus"
        - value: "Total Imports"
          data_provider: "argus"
        - value: "Total Exports"
          data_provider: "argus"
        # ---------- PA / Processed Phosphates (Argus) ----------
        - value: "PA Total Capacity"
          data_provider: "argus"
        - value: "PA Total Production"
          data_provider: "argus"
        - value: "PA Total Consumption"
          data_provider: "argus"
        - value: "PA Total Imports"
          data_provider: "argus"
        - value: "PA Total Exports"
          data_provider: "argus"
        # ---------- DAP (Argus) ----------
        - value: "DAP Total Capacity"
          data_provider: "argus"
        - value: "DAP Total Production"
          data_provider: "argus"
        - value: "DAP d.a. Consumption"
          data_provider: "argus"
        - value: "DAP Compounds Consumption"
          data_provider: "argus"
        - value: "DAP Total Consumption"
          data_provider: "argus"
        - value: "DAP Total Imports"
          data_provider: "argus"
        - value: "DAP Total Exports"
          data_provider: "argus"
        # ---------- MAP (Argus) ----------
        - value: "MAP Total Capacity"
          data_provider: "argus"
        - value: "MAP Total Production"
          data_provider: "argus"
        - value: "MAP d.a. Consumption"
          data_provider: "argus"
        - value: "MAP Compounds Consumption"
          data_provider: "argus"
        - value: "MAP Total Consumption"
          data_provider: "argus"
        - value: "MAP Total Imports"
          data_provider: "argus"
        - value: "MAP Total Exports"
          data_provider: "argus"
        # ---------- TSP (Argus) ----------
        - value: "TSP Total Capacity"
          data_provider: "argus"
        - value: "TSP Total Production"
          data_provider: "argus"
        - value: "TSP Total Consumption"
          data_provider: "argus"
        - value: "TSP Total Imports"
          data_provider: "argus"
        - value: "TSP Total Exports"
          data_provider: "argus"
        # ---------- NPK Analytics ----------
        - value: "NPK Total Capacity"
        - value: "NPK Total Production"
        - value: "NPK Total Consumption"
        - value: "NPK Total Imports"
        - value: "NPK Total Exports"
        - value: "Total NPK Capacity"
        - value: "Total NPK Production"
        - value: "Total NPK Consumption"
        - value: "Total NPK Imports"
        - value: "Total NPK Exports"

  - name: plant_capacity
    description: >
      Unified caster for plant-level capacity sheets (Company→Site + year cols).
      Argus sources only. Product/type/grade auto-detected.
      (CRU & S&P entries moved to capacity_database above)
    extractor_code: plant_capacity_caster.py

    matches:
      exact:
        # ---------- Argus Ammonia Analytics ----------
        - value: "Gross Capacity by Plant"
          data_provider: "argus"
        - value: "Merchant Capacity by Plant"
          data_provider: "argus"

        # ---------- Argus Phosphate Rock / Potash / Urea / NPK ----------
        - value: "Capacity by Plant"
          data_provider: "argus"

  - name: cru_flat_database
    description: >
      Unified caster for flat-database sheets (Region|SubRegion|Country × Years).
      S&P: ammonia outlook, sulphur outlook.
      CRU: ammonia, phosphate rock, phosphate fertilizer (WPA/DAP/MAP/TSP),
      NPK/NP/PK, sulphur. Product & layout auto-detected.
    extractor_code: cru_flat_database_caster.py

    matches:
      exact:
        # ---------- Ammonia Outlook Data File (Region/Country × Years) ----------
        - value: "Capacity by geography"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Grey ammonia capacity"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Green ammonia capacity"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Blue ammonia capacity"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Op. rate"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Production"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Grey ammonia production"
          data_provider: "sp"
          file_regex: "(?i)ammonia.?outlook.?data.?file"
        - value: "Green ammonia production"
