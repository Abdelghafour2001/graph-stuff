  - name: "vessel_tracker"
    description: "Extracteur vessel tracker"
    extractor_code: "vessel_tracker.py"
    matches:
      exact:
        - value: "Nitrates"
          data_provider: sp
  #       - value: "Potash"
  #         data_provider: sp
  #       - value: "Sulfur"
  #         data_provider: sp
  #       - value: "Phosphates"
  #         data_provider: sp
  #       - value: "Urea"
  #         data_provider: sp
  #       - value: "Sulfuric Acid"
  #         data_provider: sp
 
  # - name: "vessel_tracker_ammonia"
  #   description: "Extracteur vessel tracker"
  #   extractor_code: "vessel_tracker_ammonia.py"
 
  #   matches:
  #     exact:
  #       - value: "Ammonia"
  #         data_provider: sp  
  # - name: fertilizer_week_all_frequency
  #   description: Fertilizer week historical prices averages (All_W/M/Q/A)
  #   extractor_code: weekly_prices.py

    matches:
      exact:
        - value: "Table of Contents"
          params:
            skip: true

      regex:
        - pattern: "^All_W$"
          params:
            frequency: weekly
            data_provider: cru

        - pattern: "^All_M$"
          params:
            frequency: monthly
            data_provider: cru

        - pattern: "^All_Q$"
          params:
            frequency: quarterly
            data_provider: cru

        - pattern: "^All_A$"
          params:
            frequency: annual
            data_provider: cru
  - name: phosphate_rock_market_outlook_date_flat_database_historical
    description: Phosphate rock market outlook prices
    extractor_code: ammonia_sulphure_prices_flatdatabase.py

    matches:
      exact:
        - value: "Prices_Quarterly_Forecast"
          data_provider: cru
        - value: "Prices_Annual_Forecast"
          data_provider: cru
        - value: "Price History"
          data_provider: cru
        - value: "Prices_Monthly"
          data_provider: cru
  - name: speciality_phosphate_ammended_prices
    description: Specialty phosphate amended prices
    extractor_code: ammended_prices.py

    matches:
      exact:
        - value: "Prices"
          data_provider: cru
          file_regex: "specialty"
          params:
            data_provider: cru
  - name: piec_asset_list
    description: PIEC asset list sheets
    extractor_code: piec_asset_list_DATE.py

    matches:
      regex:
        - pattern: ".*AssetList.*"
          params:
            data_provider: sp


  - name: piec_timeseries
    description: PIEC timeseries for capacity / production / imports / exports / utilization
    extractor_code: piec_timeseries_DATE.py

    matches:
      regex:
        - pattern: "^.+_(P|I|E|D|H|O|UR|NR)$"
          params:
            data_provider: sp
            header_row: 8
  - name: phosphateoutlook_quarterly_price_forecast
    description: Phosphate outlook – Quarterly Price Forecast
    extractor_code: praw_yearly_quarterly_prices.py

    matches:
      exact:
        - value: "Quarterly Price Forecast"
          params:
            data_provider: sp
            header_rows: 11

        - value: "Introduction"
          params:
            skip: true

        - value: "Cost Curve"
          params:
            skip: true

        - value: "CostCurveGenerator"
          params:
            skip: true
  - name: phosphateoutlook_yearly_price_forecast
    description: Phosphate outlook – Yearly Price Forecast
    extractor_code: praw_yearly_quarterly_prices.py

    matches:
      exact:
        - value: "Yearly Price Forecast"
          params:
            data_provider: sp
            header_rows: 11

