  - name: specialty_phosphates_capacity_list
    description: >
      Capacity list sheets (company/site entities) from specialty phosphates
      market outlook database. Header row 3, columns: Region/Country/Company/
      Site/Product/Status/PGS Scoring + year columns.
    extractor_code: specialty_phosphates_market_outlook_DATE_database_amended__pwa_tpa_capacity_list.py

    matches:
      exact:
        - value: "Contents"
          params: { skip: true }
        - value: "Table of Contents"
          params: { skip: true }
        - value: "Data Viewer"
          params: { skip: true }


      regex:
        # ---- SKIP: landing tabs (1-cell product dividers) ----
        - pattern: "^(PWA TPA|tMAP|P4|LFP|STPP|SPA|APP|DCP|MCP[-_]MDCP)$"
          params: { skip: true }

        # ---- SKIP: trade matrix tabs ----
        - pattern: ".*\\d{4}\\s+Trade$"
          params: { skip: true }

        # ---- Capacity list: specific product group overrides (before generic) ----
        - pattern: "^PWA TPA Capacity list$"
          params: { frequency: "annual", product_group: "pwa_tpa", data_provider: "cru" }

        - pattern: "^MCP[-_]MDCP Capacity list$"
          params: { frequency: "annual", product_group: "mcp_mdcp", data_provider: "cru" }

        - pattern: "^LFP Capacity list$"
          params: { frequency: "annual", product_group: "lfp_lmfp", data_provider: "cru" }

        # ---- Capacity list: generic (APP, SPA, DCP, tMAP, P4, STPP) ----
        - pattern: ".*Capacity list$"
          params: { frequency: "annual", data_provider: "cru" }

  # ===========================================================================
  # SPECIALTY PHOSPHATES – DATA SHEETS CASTER
  # Handles Capacity/Production/Demand/Imports/Exports sheets
  # Region/country-level data (header row 2)
  # Products: PWA TPA, tMAP, P4, LFP/LMFP, STPP, SPA, DCP, MCP-MDCP
  # ===========================================================================
  - name: specialty_phosphates_capacity
    description: >
      Data sheets (capacity/production/demand/imports/exports) from specialty
      phosphates market outlook database. Region/Subregion/Country layout,
      header row 2 + year columns.
    extractor_code: specialty_phosphates_market_outlook_DATE_database_amended__pwa_tpa_capacity.py

    matches:
      regex:
        # ---- SKIP: landing tabs ----
        - pattern: "^(PWA TPA|tMAP|P4|LFP|STPP|SPA|APP|DCP|MCP[-_]MDCP)$"
          params: { skip: true }

        # ---- SKIP: trade matrix tabs ----
        - pattern: ".*\\d{4}\\s+Trade$"
          params: { skip: true }

        # ---- DATA: special case LFP P2O5 Demand ----
        - pattern: "^LFP P2O5 Demand$"
          params: { frequency: "annual", product_group: "lfp_lmfp", metric_type_override: "demand", data_provider: "cru" }

        # ---- DATA: multi-token product overrides ----
        - pattern: "^PWA TPA (Capacity|Production|Demand|Imports|Exports)$"
          params: { frequency: "annual", product_group: "pwa_tpa", data_provider: "cru" }

        - pattern: "^MCP[-_]MDCP (Capacity|Production|Demand|Imports|Exports)$"
          params: { frequency: "annual", product_group: "mcp_mdcp", data_provider: "cru" }

        - pattern: "^LFP (Capacity|Production)$"
          params: { frequency: "annual", product_group: "lfp_lmfp", data_provider: "cru" }

        # ---- DATA: generic (all remaining metric sheets) ----
        - pattern: "^(PWA TPA|tMAP|P4|LFP|STPP|SPA|APP|DCP|MCP[-_]MDCP) (Capacity|Production|Demand|Imports|Exports)$"
          params: { frequency: "annual", data_provider: "cru" }

