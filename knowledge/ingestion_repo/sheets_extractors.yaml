  - name: capacity_database
    description: >
      Unified caster for plant-level capacity sheets (Company|Plant × Years).
      S&P: Ammonia "Capacity by plant" (Refinery → plant_name).
      CRU: ammonia, phosphate-rock, phosphate-fert, npk, sulphur capacity databases.
      Product & layout auto-detected. entity = company_plant composite.
    extractor_code: cru_capacity_database_caster.py

    matches:
      exact:
        # ---------- S&P Ammonia Outlook: Capacity by plant ----------
        - value: "Capacity by plant"
          data_provider: "sp"

        # ---------- CRU: Sheets to SKIP ----------
        - value: "Table of Contents"
          data_provider: "cru"
          params: { skip: true }
        - value: "Regional Output"
          data_provider: "cru"
          params: { skip: true }
        - value: "Base Case Capacity by Country"
          data_provider: "cru"
          params: { skip: true }

        # ---------- CRU Ammonia Capacity Database ----------
        - value: "Capacity Forecasts"
          data_provider: "cru"
        - value: "Net Capacity Forecasts"
          data_provider: "cru"
        - value: "Projects"
          data_provider: "cru"

        # ---------- CRU Phosphate Rock Capacity Database ----------
        - value: "Capacity Forecasts - Base Case"
          data_provider: "cru"

        # ---------- CRU Phosphate Fertilizer Capacity Database ----------
        - value: "WPA"
          data_provider: "cru"
        - value: "DAP"
          data_provider: "cru"
        - value: "MAP"
          data_provider: "cru"
        - value: "TSP"
          data_provider: "cru"
        - value: "NPK (Phos acid)"
          data_provider: "cru"

      regex:
        # ---------- S&P S-Capacity by plant: SKIP all ----------
        - pattern: "^S-Capacity by plant .+$"
