################################
#### Product Variants       ####
################################
# Variants are NOT separate products — they qualify the base product.
# The caster stores product = base, variant = key below.
# e.g. Commodity "Green ammonia" → product=ammonia, variant=green
product_variants:
  ammonia:
    - grey
    - green
    - blue
    - low_carbon
    - lowemissions
  sulphur:
    - elemental
 
