###########################################
#### Skip keywords for row filtering   ####
###########################################
# Rows where country/region matches any of these (substring) are excluded.
# The caster loads this list at startup — no hardcoded values.
skip_country_keywords:
  - total
  - grand total
  - sub-total
  - subtotal
  - world
  - global
  - aggregate
  - sum
  - summary
  - average
  - moyenne
  - undefined
  - unidentified
  - geographically_unassigned
 
